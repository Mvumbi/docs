components:
  schemas:
    Credentials:
      type: object
      required: [gatewayMode, publicApiKey, secretApiKey]
      properties:
        gatewayMode:
          type: string
          enum: ["0", "1"]
          description: "0 = Sandbox, 1 = Production (Live)."
        publicApiKey:
          type: string
          description: Clé API publique fournie par MaishaPay.
        secretApiKey:
          type: string
          description: Clé API secrète fournie par MaishaPay.

    Cost:
      type: object
      properties:
        amount:
          type: number
        frais:
          type: number
        total:
          type: number
        currency:
          type: string

    ProviderInfo:
      type: object
      properties:
        libelle:
          type: string
          example: "AIRTEL"
        picture:
          type: string
          example: "service-logos/airtelmoney.png"

    MobileMoneyCollectionRequest:
      allOf:
        - $ref: "#/components/schemas/Credentials"
        - type: object
          required: [transactionReference, order, paymentChannel]
          properties:
            transactionReference:
              type: string
              description: Référence unique fournie par le marchand.
            order:
              type: object
              required: [amount, currency]
              properties:
                amount:
                  type: string
                  description: Minimum 100 pour les devises locales, 0.5 pour l'USD.
                currency:
                  type: string
                  example: "CDF"
                customerFullName:
                  type: string
                customerEmailAdress:
                  type: string
                  format: email
            paymentChannel:
              type: object
              required: [channel, provider, walletID, callbackUrl]
              properties:
                channel:
                  type: string
                  enum: [MOBILEMONEY]
                provider:
                  type: string
                  description: Opérateur Mobile Money (ex. AIRTEL, ORANGE, MTN, MPESA).
                  example: "AIRTEL"
                walletID:
                  type: string
                  description: Numéro de téléphone au format international.
                  example: "+24399XXXXXXX"
                callbackUrl:
                  type: string
                  format: uri
                  description: URL recevant la notification finale (requête POST).

    MobileMoneyCollectionResponse:
      type: object
      properties:
        status_code:
          type: integer
        transactionStatus:
          type: string
          enum: [PENDING, SUCCESS, FAILED]
        transactionId:
          type: integer
        originatingTransactionId:
          type: string
        order:
          type: object
          properties:
            customerFullName:
              type: string
            customerEmailAdress:
              type: string
            cost:
              $ref: "#/components/schemas/Cost"
        paymentChannel:
          type: object
          properties:
            channel:
              type: string
            provider:
              $ref: "#/components/schemas/ProviderInfo"
            walletID:
              type: string
        created_at:
          type: string
        updated_at:
          type: string

    CardCollectionRequest:
      allOf:
        - $ref: "#/components/schemas/Credentials"
        - type: object
          required: [transactionReference, order, paymentChannel]
          properties:
            transactionReference:
              type: string
            order:
              type: object
              required: [amount, currency, customerPhoneNumber, customerEmailAdress]
              properties:
                amount:
                  type: string
                currency:
                  type: string
                  description: "⚠️ Incohérence source : tableau des paramètres indique USD/EURO, exemple cURL indique USD/CDF. À confirmer."
                  example: "USD"
                customerFirstname:
                  type: string
                customerLastname:
                  type: string
                customerAddress:
                  type: string
                customerCity:
                  type: string
                customerPhoneNumber:
                  type: string
                customerEmailAdress:
                  type: string
                  format: email
            paymentChannel:
              type: object
              required: [channel, provider, callbackUrl]
              properties:
                channel:
                  type: string
                  enum: [CARD]
                provider:
                  type: string
                  enum: [VISA, MASTERCARD, "AMERICAN EXPRESS"]
                callbackUrl:
                  type: string
                  format: uri
                  description: URL recevant la notification finale (requête GET, query params).

    CardCollectionResponse:
      type: object
      properties:
        status_code:
          type: integer
        transactionId:
          type: integer
        originatingTransactionId:
          type: string
        transactionStatus:
          type: string
          enum: [PENDING, SUCCESS, FAILED]
        transactionDescription:
          type: string
        paymentPage:
          type: string
          format: uri
          description: URL de redirection vers CyberSource pour finaliser le paiement.
        updated_at:
          type: string

    TransactionLookupRequest:
      allOf:
        - $ref: "#/components/schemas/Credentials"
        - type: object
          required: [transactionId]
          properties:
            transactionId:
              type: string
              description: ID MaishaPay, ou référence marchand si `useRef=1`.

    CollectLookupResponse:
      type: object
      properties:
        transaction_type:
          type: string
          enum: ["C2B | Collect"]
        status_code:
          type: integer
        transactionStatus:
          type: string
        transactionId:
          type: integer
        originatingTransactionId:
          type: string
        order:
          type: object
          properties:
            customerFullName:
              type: string
              nullable: true
            customerPhoneNumber:
              type: string
            customerEmailAdress:
              type: string
              nullable: true
            cost:
              $ref: "#/components/schemas/Cost"
        paymentChannel:
          type: object
          properties:
            channel:
              type: string
            provider:
              type: string
        walletID:
          type: string
        created_at:
          type: string
        updated_at:
          type: string

    TransferLookupResponse:
      type: object
      properties:
        transaction_type:
          type: string
          enum: ["B2C | Transfert"]
        status_code:
          type: integer
        transactionStatus:
          type: string
          enum: [SUCCESS, FAILED, PENDING]
        transactionId:
          type: integer
        originatingTransactionId:
          type: string
        recipient:
          type: object
          properties:
            customerFullName:
              type: string
            customerEmailAdress:
              type: string
              nullable: true
            walletID:
              type: string
        provider:
          $ref: "#/components/schemas/ProviderInfo"
        cost:
          $ref: "#/components/schemas/Cost"
        motif:
          type: string
        date:
          type: string

    B2CTransferRequest:
      allOf:
        - $ref: "#/components/schemas/Credentials"
        - type: object
          required: [transactionReference, order, paymentChannel]
          properties:
            transactionReference:
              type: string
            order:
              type: object
              required: [amount, currency]
              properties:
                motif:
                  type: string
                  description: Raison du transfert (optionnel).
                amount:
                  type: string
                  description: Doit être supérieur à 100 pour les devises locales.
                currency:
                  type: string
                customerFullName:
                  type: string
                customerEmailAdress:
                  type: string
            paymentChannel:
              type: object
              required: [provider, walletID, callbackUrl]
              properties:
                provider:
                  type: string
                  example: "AIRTEL"
                walletID:
                  type: string
                  description: Numéro de téléphone du bénéficiaire (format international).
                callbackUrl:
                  type: string
                  format: uri

    BalanceReportRequest:
      allOf:
        - $ref: "#/components/schemas/Credentials"
        - type: object
          required: [wallet, currency]
          properties:
            wallet:
              type: string
              enum: [Collect, Transfert, Airtime, PayTv]
            currency:
              type: string
              example: "CDF"

    BalanceReportResponse:
      type: object
      properties:
        merchant:
          type: string
        gatewayMode:
          type: string
          enum: [LIVE, SANDBOX]
        wallet:
          type: string
        solde:
          type: number
        currency:
          type: string

    Country:
      type: object
      properties:
        id:
          type: integer
        code:
          type: integer
        alpha2:
          type: string
        alpha3:
          type: string
        nom_en_gb:
          type: string
        nom_fr_fr:
          type: string
        continent:
          type: string
        currencyCode:
          type: string
        currencyName:
          type: string
        currencySymbol:
          type: string
        flag:
          type: string
          format: uri
        callingCodes:
          type: string

    Currency:
      type: object
      properties:
        id:
          type: integer
        libelle:
          type: string
        code:
          type: string
        symbole:
          type: string

    TvOperator:
      type: object
      properties:
        id:
          type: integer
        libelle:
          type: string
          example: "Canal+ RDC"
        logo:
          type: string
        status:
          type: string
          enum: [enabled, disabled]
        pay_id:
          type: integer
        devises:
          type: array
          items:
            $ref: "#/components/schemas/Currency"
        pays:
          $ref: "#/components/schemas/Country"

    TvBouquet:
      type: object
      properties:
        id:
          type: integer
        libelle:
          type: string
          example: "ACCESS"
        tv_operator_id:
          type: integer

    TvBouquetDetail:
      allOf:
        - $ref: "#/components/schemas/TvBouquet"
        - type: object
          properties:
            tv_periodes:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  libelle:
                    type: string
                    example: "Mois"
                  pivot:
                    type: object
                    properties:
                      bouquet_id:
                        type: integer
                      tv_periode_id:
                        type: integer
                      prix:
                        type: number
                      devise_id:
                        type: integer
            tv_operator:
              $ref: "#/components/schemas/TvOperator"

    TvSubscriptionRequest:
      allOf:
        - $ref: "#/components/schemas/Credentials"
        - type: object
          required: [transactionReference, operation, operator, bouquet, periode, currency, numCard]
          properties:
            transactionReference:
              type: string
            operation:
              type: string
              enum: [abonnement, reabonnement]
            operator:
              type: string
              description: Identifiant de l'opérateur TV.
            bouquet:
              type: string
              description: Identifiant du bouquet.
            periode:
              type: string
              description: Identifiant de la période d'abonnement.
            currency:
              type: string
              enum: [CDF, USD]
            numCard:
              type: string
              description: Numéro de carte de l'opérateur TV.

security: []